[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fd-zhesi-api"
version = "0.1.0"
description = "哲思（zhesi）产品门面服务端：官网/工作台/管理后台 API。个人层（立场卡/张力簿/思想年轮）的自有存储在本服务。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FindDataTechnology" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "pyjwt[crypto]>=2.8",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
